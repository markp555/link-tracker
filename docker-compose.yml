version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2    
  db:
    image: postgres:15-alpine
    container_name: scrapper_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trackerdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  valkey-db:
    image: valkey/valkey:latest
    container_name: valkey_instance
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  scrapper:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: scrapper_service
    working_dir: /src/LinkTracker.Scrapper/
    command: dotnet run
    env_file: .env
    user: root
    environment:
      - Remote__UseGRPC=false
      - Remote__DatabaseConnectionString=Host=db;Port=5432;Database=trackerdb;Username=postgres;Password=postgres
      - Remote__BotEndpoint=http://bot:5205/
      - Remote__NotificationType=Kafka
      - Kafka__Servers=kafka-1:29092,kafka-2:29093,kafka-3:29094
      - ConnectionStrings__Valkey=valkey-db:6379
      - Remote__UseCache=true
      - ASPNETCORE_HTTP_PORTS=
      - ASPNETCORE_URLS=
    depends_on:
      db:
        condition: service_healthy
      valkey-db:
        condition: service_healthy
    networks:
      - app-network
    expose:
      - "5048"
    volumes:
      - nuget_cache:/home/root/.nuget
      - ./src:/src
    restart: unless-stopped

  bot:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /src/LinkTracker.Bot/
    env_file: .env
    command: dotnet run
    container_name: bot_service
    user: root
    environment:
      - Remote__UseGRPC=false
      - Remote__ScrapperEndpoint=http://scrapper:5048/
      - Remote__UseKafka=true
      - Kafka__Servers=kafka-1:29092,kafka-2:29093,kafka-3:29094
      - ASPNETCORE_HTTP_PORTS=
      - ASPNETCORE_URLS=
    networks:
      - app-network
    expose:
      - "5205"
    volumes:
      - nuget_cache:/home/root/.nuget
      - ./src:/src
    depends_on:
      scrapper:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  nuget_cache:
  valkey_data:

networks:
  app-network:
    driver: bridge
