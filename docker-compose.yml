version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scrapper_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trackerdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  scrapper:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: scrapper_service
    working_dir: /src/LinkTracker.Scrapper/
    command: dotnet run
    env_file: .env
    user: root
    environment:
      - Remote__UseGRPC=false
      - Remote__DatabaseConnectionString=Host=db;Port=5432;Database=trackerdb;Username=postgres;Password=postgres
      - Remote__BotEndpoint=http://bot:5205/
      - ASPNETCORE_HTTP_PORTS=
      - ASPNETCORE_URLS=
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    expose:
      - "5048"
    volumes:
      - nuget_cache:/home/root/.nuget
      - ./src:/src
    restart: unless-stopped

  bot:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /src/LinkTracker.Bot/
    env_file: .env
    command: dotnet run
    container_name: bot_service
    user: root
    environment:
      - Remote__UseGRPC=false
      - Remote__ScrapperEndpoint=http://scrapper:5048/
      - ASPNETCORE_HTTP_PORTS=
      - ASPNETCORE_URLS=
    networks:
      - app-network
    expose:
      - "5205"
    volumes:
      - nuget_cache:/home/root/.nuget
      - ./src:/src
    depends_on:
      scrapper:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  nuget_cache:

networks:
  app-network:
    driver: bridge