image: mcr.microsoft.com/dotnet/sdk:9.0

stages:
  - build
  - validate
  - test

build:
  stage: build
  script:
    - dotnet build
  only:
    - merge_requests
    - master

linter:
  stage: validate
  script:
    - dotnet format --verify-no-changes
  only:
    - merge_requests
    - master

module_test:
  stage: test
  needs:
    - job: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "master"
      when: always
      allow_failure: false
    - when: never
  script:
    - dotnet test
  services:
  - name: postgres:15
    alias: postgres
  - name: docker:dind
  variables:
    POSTGRES_DB: trackerdb
    POSTGRES_USER: gitlab
    POSTGRES_PASSWORD: gitlab_password
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: 0
    # LOCAL_CI_POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=trackerdb;Username=gitlab;Password=gitlab_password
  